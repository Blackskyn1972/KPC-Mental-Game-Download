name: Publish KPC Android V2.13
on:
  push:
    paths:
      - ".github/workflows/publish-android-v213.yml"
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signed KPC V2.13 APK
        run: |
          set -e
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1574-81f4-9185-ce49c6d1477f/raw?se=2026-09-19T10%3A05%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=189204b0-80da-5fc8-ba91-1b41d12e5279&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T09%3A05%3A23Z&ske=2026-09-20T09%3A05%3A23Z&sks=b&skv=2026-02-06&sig=VGroq0J/E9u6Mc2mvTLG1ofi/7vPOG1sSmcA0Tj0sdA%3D' -o /tmp/kpc-v213.zip
          unzip -o /tmp/kpc-v213.zip KPC-Mental-Game.apk -d .
          test -s KPC-Mental-Game.apk

      - name: Update public version metadata
        run: |
          cat > update.json <<'JSON'
          {
            "versionCode": 33,
            "versionName": "2.13",
            "downloadUrl": "https://raw.githubusercontent.com/Blackskyn1972/KPC-Mental-Game-Download/main/KPC-Mental-Game.apk",
            "notes": "V2.13 : le numéro de version est désormais visible directement en haut de l'accueil."
          }
          JSON
          sed -i 's/V2\.12/V2.13/g' download.html

      - name: Publish V2.13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KPC-Mental-Game.apk update.json download.html
          git diff --cached --quiet || git commit -m "Publish KPC Mental Game et Compétition Android V2.13"
          git push
